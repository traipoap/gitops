apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
images:
  - name: ghcr.io/traipoap/backend
    newTag: "0.0.54" # {"$imagepolicy": "staging:backend:tag"}
  - name: ghcr.io/traipoap/frontend
    newTag: "0.0.53" # {"$imagepolicy": "staging:frontend:tag"}
patches:
  - path: patch-config.yaml
  - path: patch-httproute.yaml
  - path: patch-frontend-nginx.yaml
namespace: staging
