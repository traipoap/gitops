---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: quickwit-s3-values
  namespace: logging
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: secretstore-aws
    kind: ClusterSecretStore
  target:
    name: quickwit-s3-secret-values
    template:
      engineVersion: v2
      data:
        values.yaml: |
          config:
            storage:
              s3:
                access_key_id: "{{ .access_key_id }}"
                secret_access_key: "{{ .secret_access_key }}"
                endpoint: "{{ .endpoint }}"
  data:
    - secretKey: access_key_id
      remoteRef:
        key: dev/lumina/quickwit/s3
        property: access_key_id
    - secretKey: secret_access_key
      remoteRef:
        key: dev/lumina/quickwit/s3
        property: secret_access_key
    - secretKey: endpoint
      remoteRef:
        key: dev/lumina/quickwit/s3
        property: endpoint
---
