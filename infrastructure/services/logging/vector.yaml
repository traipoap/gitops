---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: vector-repo
spec:
  interval: 1m0s
  timeout: 3m0s
  url: https://helm.vector.dev
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vector
spec:
  # Ship logs only after the Quickwit sink is up (avoids crash-loop / retry spam
  # during bootstrap). Enforced by the Flux HelmRelease dependency graph.
  dependsOn:
    - name: quickwit
  chart:
    spec:
      chart: vector
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: vector-repo

  interval: 1m0s

  values:
    customConfig:
      api:
        address: 127.0.0.1:8686
        enabled: true
      data_dir: /vector-data-dir
      log_schema:
        host_key: host
      sinks:
        quickwit_syslogs:
          encoding:
            codec: json
          framing:
            method: newline_delimited
          inputs:
          - vector_timestamp
          method: post
          type: http
          uri: http://quickwit-searcher:7280/api/v1/syslogs/ingest
      sources:
        syslog_tcp:
          address: 0.0.0.0:514
          decoding:
            codec: bytes
          mode: tcp
          receive_buffer_bytes: 67108864
          type: syslog
        syslog_udp:
          address: 0.0.0.0:514
          decoding:
            codec: bytes
          mode: udp
          receive_buffer_bytes: 67108864
          type: syslog
      transforms:
        vector_timestamp:
          inputs:
          - syslog_tcp
          - syslog_udp
          source: |
            # 1. ใช้เวลาที่ Vector รับ log (UTC)
            .vector_time_utc = now()

            # 2. เก็บเป็น Unix timestamp แบบ nanoseconds (สำหรับ indexing ใน Quickwit)
            .index_timestamp = to_unix_timestamp(.vector_time_utc, unit: "nanoseconds")

            # for quickwit and this worked
            #.event_time = format_timestamp!(.timestamp, format: "%+")

            # 3. ลบตัวแปรชั่วคราวออก
            del(.vector_time_utc)
          type: remap
    role: Agent
    service:
      enabled: true
      type: "NodePort"
      ports:
        - name: syslog-tcp
          port: 514
          targetPort: 514
          protocol: TCP
          nodePort: 30514
        - name: syslog-udp
          port: 514
          targetPort: 514
          protocol: UDP
          nodePort: 30515
